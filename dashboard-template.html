<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub training</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a18;--mut:#5f5f5a;--line:#e3e3de;--card:#fff;--accent:#2f5d50;--mark:#fff0b8}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ececea;--mut:#a3a39d;--line:#2c2e33;--card:#1d1f23;--accent:#82b8a5;--mark:#4a4526}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:34px 20px 90px}
h1{font-size:28px;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 22px;max-width:64ch}
.search{position:sticky;top:0;background:var(--bg);padding:12px 0 14px;z-index:5;
 border-bottom:1px solid var(--line);margin-bottom:20px}
input[type=search]{width:100%;padding:13px 15px;font-size:16px;border:1px solid var(--line);
 border-radius:9px;background:var(--card);color:var(--fg)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--mut);font-size:13px;margin-top:9px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .18s}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);
 margin:30px 0 3px;font-weight:600}
.gdesc{color:var(--mut);font-size:14px;margin:0 0 13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;
 margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.card h3{margin:0 0 5px;font-size:17px;line-height:1.35}
.card h3 a{color:var(--fg);text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.card p{margin:0;color:var(--mut);font-size:14.5px}
.qs{margin:10px 0 0;padding:0;list-style:none}
.qs li{font-size:13.5px;color:var(--mut);padding:2px 0 2px 15px;position:relative}
.qs li:before{content:"";position:absolute;left:2px;top:11px;width:4px;height:4px;
 border-radius:50%;background:var(--accent)}
.tick{flex:0 0 auto;margin-top:3px}
.tick input{width:19px;height:19px;accent-color:var(--accent);cursor:pointer}
.done h3 a{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.empty{color:var(--mut);padding:26px 0}
footer{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
<h1>GitHub training</h1>
<p class="sub">Every topic in one place. Search for the thing you are stuck on, or work down the list
in order. Ticking a topic saves in this browser, so you can see how far you have got.</p>

<div class="search">
  <input type="search" id="q" autocomplete="off"
    placeholder="What are you trying to do? Try: conflict, invite someone, undo, public">
  <div class="count" id="count"></div>
  <div class="bar"><i id="bar"></i></div>
</div>

<div id="list"></div>
<footer id="foot"></footer>
</div>

<script>
var DATA = __DATA__;
var GROUPS = __GROUPS__;
var KEY = 'ghkit-done';
var done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function hl(s, q){
  s = String(s || '');
  if (!q) return esc(s);
  var i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i,i+q.length)) + '</mark>' + esc(s.slice(i+q.length));
}

function matches(it, q){
  if (!q) return true;
  var hay = (it.title + ' ' + (it.blurb||'') + ' ' + (it.qs||[]).join(' ')).toLowerCase();
  return hay.indexOf(q) >= 0;
}

function card(it, q){
  var id = 't' + (it.n || it.title);
  var isDone = done.has(id);
  var qs = (it.qs || []).filter(function(x){ return !q || x.toLowerCase().indexOf(q) >= 0; }).slice(0,4);
  var list = qs.length ? '<ul class="qs">' + qs.map(function(x){ return '<li>' + hl(x,q) + '</li>'; }).join('') + '</ul>' : '';
  return '<div class="card' + (isDone ? ' done' : '') + '">' +
    '<label class="tick"><input type="checkbox" data-id="' + id + '"' + (isDone ? ' checked' : '') +
      ' aria-label="Mark as read"></label>' +
    '<div style="flex:1"><h3><a href="' + it.file + '">' + hl(it.title,q) + '</a></h3>' +
    '<p>' + hl(it.blurb,q) + '</p>' + list + '</div></div>';
}

function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var out = '', shown = 0, i, g, inGroup;
  for (i = 0; i < GROUPS.length; i++){
    g = GROUPS[i];
    inGroup = DATA.items.filter(function(it){ return it.n >= g[2] && it.n <= g[3] && matches(it,q); });
    if (!inGroup.length) continue;
    shown += inGroup.length;
    out += '<h2>' + esc(g[0]) + '</h2><p class="gdesc">' + esc(g[1]) + '</p>' +
           inGroup.map(function(it){ return card(it,q); }).join('');
  }
  var ex = DATA.extras.filter(function(it){ return matches(it,q); });
  if (ex.length){
    shown += ex.length;
    out += '<h2>Reference</h2><p class="gdesc">Not lessons. Look things up here.</p>' +
           ex.map(function(it){ return card(it,q); }).join('');
  }
  document.getElementById('list').innerHTML = out ||
    '<p class="empty">Nothing matches that. Try a plainer word, such as invite, conflict, private or undo.</p>';
  document.getElementById('count').textContent = q ? (shown + ' matching') :
    (DATA.items.length + ' topics, ' + DATA.extras.length + ' reference pages');
  var total = DATA.items.length + DATA.extras.length;
  var pct = total ? Math.round(100 * done.size / total) : 0;
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('foot').textContent = done.size
    ? ('You have ticked ' + pct + ' per cent of this kit. Progress is saved in this browser only.')
    : 'Tick a topic once you have read it. Progress is saved in this browser only.';
}

document.addEventListener('input', function(e){ if (e.target.id === 'q') render(); });
document.addEventListener('change', function(e){
  if (e.target.type === 'checkbox' && e.target.dataset.id){
    if (e.target.checked) { done.add(e.target.dataset.id); } else { done.delete(e.target.dataset.id); }
    localStorage.setItem(KEY, JSON.stringify(Array.from(done)));
    render();
  }
});
render();
</script>
</body>
</html>
